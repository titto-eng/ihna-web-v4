kind = "web"
previewPath = "/"
title = "IHNA Website"
description = "Existing IHNA Next.js and Payload CMS website imported for a restricted reviewer test, with its PostgreSQL content database."
version = "1.0.0"
id = "artifacts/ihna-website"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21867

[services.development]
run = "pnpm --filter @workspace/ihna-website run start"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ihna-website", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/ihna-website", "run", "start" ]

[services.env]
PORT = "21867"
BASE_PATH = "/"
