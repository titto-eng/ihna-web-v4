# Full local stack for Docker Desktop (Windows / macOS / Linux): the Next.js + Payload app runs in a container too, so no
# Homebrew/host Postgres or host Node is needed. Use it together with docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# Site: http://localhost:3001 · Admin: http://localhost:3001/admin · Mailpit: http://localhost:8026
# Step-by-step guide: docs/LOCAL-DOCKER.md
services:
  # Ports are remapped with `!override` so this stack never clashes with another Mailpit / MySQL / Postgres already on the
  # machine (e.g. ihm-web's Mailpit on 1025/8025). Inside the compose network the app still uses mailpit:1025.
  mailpit:
    ports: !override
      - '${MAILPIT_UI_PORT:-8026}:8025'
      # SMTP for a dev server run on the host (`npm run dev` in PowerShell: .env SMTP_HOST=127.0.0.1, SMTP_PORT=1026); 1026, not 1025,
      # so it never clashes with another Mailpit already on the machine.
      - '${MAILPIT_SMTP_PORT:-1026}:1025'
  portal-mysql:
    ports: !override
      - '${PORTAL_MYSQL_PORT:-3308}:3306'
  postgres:
    ports: !override
      - '${POSTGRES_PORT:-5434}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ihna']
      interval: 5s
      timeout: 3s
      retries: 30

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    env_file: [.env]
    environment:
      # Inside the compose network the services are reached by name; these override the host values in .env.
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ihna
      NEXT_PUBLIC_SITE_URL: http://localhost:3001
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      PORTAL_DB_HOST: portal-mysql
      PORTAL_DB_PORT: '3306'
      # File watching over a Windows bind mount needs polling.
      WATCHPACK_POLLING: 'true'
      CHOKIDAR_USEPOLLING: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    ports: ['3001:3001']
    volumes:
      - .:/app
      # Linux node_modules and the Next cache live in volumes (never the Windows bind mount): faster and no native-binary clashes.
      - node_modules:/app/node_modules
      - next_cache:/app/.next
      # Read-only inputs of the import scripts (they resolve ../ihna-web-2.0 and ../inventory from /app). The old WordPress
      # folder is never written to. Override the host paths in .env (OLD_WP_PATH / INVENTORY_PATH) when they are not siblings.
      - ${OLD_WP_PATH:-../ihna-web-2.0}:/ihna-web-2.0:ro
      - ${INVENTORY_PATH:-../inventory}:/inventory:ro
    command: ['bash', '-c', "tr -d '\\r' < docker/dev-entrypoint.sh | bash"]

volumes:
  node_modules:
  next_cache:
